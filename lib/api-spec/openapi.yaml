          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContributionBody"
      responses:
        "200":
          description: Contribution updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contribution"
        "404":
          description: Not found
    delete:
      operationId: deleteContribution
      tags:
        - contributions
      summary: Delete a contribution
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":

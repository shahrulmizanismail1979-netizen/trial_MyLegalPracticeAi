openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: subscribers
    description: Subscriber management
  - name: kohorts
    description: Kohort management
  - name: pricing
    description: Price management
  - name: vouchers
    description: Discount voucher management
  - name: dashboard
    description: Dashboard summary
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: contributions
    description: Document contribution portal and knowledge base
  - name: assistant
    description: AI receptionist assistant for the landing page
  - name: crim
    description: MyCrimAI criminal law app endpoints (/crim/*)
  - name: corp
    description: MyCorpLegalAI corporate secretary app endpoints (/corp/*)
paths:
  /assistant/chat:
    post:
      operationId: assistantChat
      tags:
        - assistant
      summary: Chat with the AI receptionist
      description: Streams an assistant reply as Server-Sent Events. Public endpoint — no authentication required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantChatBody"
      responses:
        "200":
          description: SSE stream of assistant reply chunks
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid request body
  /currency/rates:
    get:
      operationId: getCurrencyRates
      tags:
        - currency
      summary: USD exchange rates for display currencies
      description: Returns cached USD-based exchange rates for supported display currencies. Public endpoint.
      responses:
        "200":
          description: Exchange rates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrencyRates"
  /healthz:
    get:
      operationId: healthCheck
      tags:
        - health
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /stats/subscribers-by-app:
    get:
      operationId: getAppSubscriberStats
      tags:
        - dashboard
      summary: Public subscriber counts per app
      description: Returns confirmed subscriber counts for each AI Portal. Public endpoint — no authentication required.
      responses:
        "200":
          description: Per-app subscriber counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppSubscriberStat"
  /admin/dashboard:
    get:
      operationId: getDashboardStats
      tags:
        - dashboard
      summary: Get dashboard statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"
  /admin/subscribers:
    get:
      operationId: listSubscribers
      tags:
        - subscribers
      summary: List all subscribers
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - pending
              - confirmed
              - rejected
              - cancelled
        - name: app
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of subscribers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subscriber"
    post:
      operationId: createSubscriber
      tags:
        - subscribers
      summary: Add a new subscriber
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriberBody"
      responses:
        "201":
          description: Subscriber created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscriber"
  /admin/subscribers/{id}:
    get:
      operationId: getSubscriber
      tags:
        - subscribers
      summary: Get a subscriber by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Subscriber details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscriber"
        "404":
          description: Not found
    patch:
      operationId: updateSubscriber
      tags:
        - subscribers
      summary: Update a subscriber
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubscriberBody"
      responses:
        "200":
          description: Subscriber updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscriber"
        "404":
          description: Not found
    delete:
      operationId: deleteSubscriber
      tags:
        - subscribers
      summary: Delete a subscriber
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
  /admin/kohorts:
    get:
      operationId: listKohorts
      tags:
        - kohorts
      summary: List all kohorts
      responses:
        "200":
          description: List of kohorts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Kohort"
    post:
      operationId: createKohort
      tags:
        - kohorts
      summary: Create a new kohort
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKohortBody"
      responses:
        "201":
          description: Kohort created
          content:
            application/json:
              schema:

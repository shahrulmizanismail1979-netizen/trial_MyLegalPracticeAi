      summary: Update a kohort
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateKohortBody"
      responses:
        "200":
          description: Kohort updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kohort"
        "404":
          description: Not found
  /admin/pricing:

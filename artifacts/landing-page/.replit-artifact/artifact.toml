kind = "web"
previewPath = "/"
title = "AI Web Books Landing Page"
version = "1.0.0"
id = "artifacts/landing-page"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18083

[services.development]
run = "pnpm --filter @workspace/landing-page run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/landing-page", "run", "build" ]
publicDir = "artifacts/landing-page/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/contribute"
to = "/contribute.html"

[[services.production.rewrites]]
from = "/contribute/*"
to = "/contribute.html"

[[services.production.rewrites]]
from = "/sign-in"
to = "/index.html"

[[services.production.rewrites]]
from = "/sign-in/*"
to = "/index.html"

[[services.production.rewrites]]
from = "/sign-up"
to = "/index.html"

[[services.production.rewrites]]
from = "/sign-up/*"
to = "/index.html"

[[services.production.rewrites]]
from = "/admin"
to = "/index.html"

[[services.production.rewrites]]
from = "/admin/*"
to = "/index.html"

[[services.production.rewrites]]
from = "/apps"
to = "/index.html"

[[services.production.rewrites]]
from = "/apps/*"
to = "/index.html"

[[services.production.rewrites]]
from = "/lawyes"
to = "/index.html"

[[services.production.rewrites]]
from = "/lawyes/*"
to = "/index.html"

[[services.production.rewrites]]
from = "/lawyes-safe-preview"
to = "/index.html"

[[services.production.rewrites]]
from = "/lawyes-safe-preview/*"
to = "/index.html"

[[services.production.rewrites]]
from = "/manage-subscription"
to = "/index.html"

[[services.production.rewrites]]
from = "/manage-subscription/*"
to = "/index.html"

[[services.production.rewrites]]
from = "/unsubscribe"
to = "/index.html"

[[services.production.rewrites]]
from = "/unsubscribe/*"
to = "/index.html"

[[services.production.rewrites]]
from = "/staff/sign-in"
to = "/index.html"

[[services.production.rewrites]]
from = "/staff/sign-in/*"
to = "/index.html"

[[services.production.rewrites]]
from = "/staff/sign-up"
to = "/index.html"

[[services.production.rewrites]]
from = "/staff/sign-up/*"
to = "/index.html"

[services.env]
PORT = "18083"
BASE_PATH = "/"

kind = "web"
previewPath = "/mysyariahai/"
title = "MySyalitAI"
version = "1.0.0"
id = "artifacts/mysyariahai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/mysyariahai/" ]
localPort = 25600

[services.development]
run = "pnpm --filter @workspace/mysyariahai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mysyariahai", "run", "build" ]
publicDir = "artifacts/mysyariahai/dist/public"
serve = "static"


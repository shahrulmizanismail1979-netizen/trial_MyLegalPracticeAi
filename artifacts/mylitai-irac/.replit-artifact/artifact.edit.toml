kind = "web"
previewPath = "/mylitai-irac/"
title = "MyLitAI IRAC"
version = "1.0.0"
id = "artifacts/mylitai-irac"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/mylitai-irac/" ]
localPort = 25400

[services.development]
run = "pnpm --filter @workspace/mylitai-irac run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mylitai-irac", "run", "build" ]
publicDir = "artifacts/mylitai-irac/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25400"
BASE_PATH = "/mylitai-irac/"

kind = "web"
previewPath = "/mylitai/"
title = "MyLitAI"
version = "1.0.0"
id = "artifacts/mylitai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/mylitai/" ]
localPort = 25300

[services.development]
run = "pnpm --filter @workspace/mylitai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mylitai", "run", "build" ]
publicDir = "artifacts/mylitai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/login"
to = "/login.html"

[[services.production.rewrites]]
from = "/app"
to = "/index.html"

[[services.production.rewrites]]
from = "/app/matters/*"
to = "/index.html"

[[services.production.rewrites]]
from = "/app/*"
to = "/index.html"

[[services.production.rewrites]]
from = "/admin"
to = "/index.html"

[services.env]
PORT = "25300"
BASE_PATH = "/mylitai/"

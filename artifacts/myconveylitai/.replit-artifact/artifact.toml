kind = "web"
previewPath = "/myconveylitai/"
title = "MyConveyLitAI"
version = "1.0.0"
id = "artifacts/myconveylitai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/myconveylitai/" ]
localPort = 24539

[services.development]
run = "pnpm --filter @workspace/myconveylitai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/myconveylitai", "run", "build" ]
publicDir = "artifacts/myconveylitai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/login"
to = "/login.html"

[[services.production.rewrites]]
from = "/signup"
to = "/signup.html"

[[services.production.rewrites]]
from = "/pricing"
to = "/pricing.html"

[[services.production.rewrites]]
from = "/dashboard"
to = "/index.html"

[[services.production.rewrites]]
from = "/admin"
to = "/index.html"

[services.env]
PORT = "24539"
BASE_PATH = "/myconveylitai/"

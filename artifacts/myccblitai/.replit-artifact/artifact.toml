kind = "web"
  previewPath = "/myccblitai/"
  title = "MyCorpCommBankLitAI"
  version = "1.0.0"
  id = "artifacts/myccblitai"
  router = "path"

  [[integratedSkills]]
  name = "react-vite"
  version = "1.0.0"

  [[services]]
  name = "web"
  paths = [ "/myccblitai/" ]
  localPort = 25500

  [services.development]
  run = "pnpm --filter @workspace/myccblitai run dev"

  [services.production]
  build = [ "pnpm", "--filter", "@workspace/myccblitai", "run", "build" ]
  publicDir = "artifacts/myccblitai/dist/public"
  serve = "static"

  [[services.production.rewrites]]
  from = "/*"
  to = "/index.html"

  [services.env]
  PORT = "25500"
  BASE_PATH = "/myccblitai/"
  
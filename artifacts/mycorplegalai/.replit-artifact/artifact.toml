kind = "web"
previewPath = "/mycorplegalai/"
title = "MyCorpLegalAI"
version = "1.0.0"
id = "artifacts/mycorplegalai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/mycorplegalai/" ]
localPort = 25195

[services.development]
run = "pnpm --filter @workspace/mycorplegalai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mycorplegalai", "run", "build" ]
publicDir = "artifacts/mycorplegalai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/login"
to = "/login.html"

[[services.production.rewrites]]
from = "/pricing"
to = "/pricing.html"

[[services.production.rewrites]]
from = "/dashboard"
to = "/index.html"

[[services.production.rewrites]]
from = "/section/*"
to = "/index.html"

[[services.production.rewrites]]
from = "/tools"
to = "/index.html"

[[services.production.rewrites]]
from = "/tools/*"
to = "/index.html"

[[services.production.rewrites]]
from = "/admin"
to = "/index.html"

[services.env]
PORT = "25195"
BASE_PATH = "/mycorplegalai/"
